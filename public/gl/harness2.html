<!doctype html>
<html><head><meta charset="utf-8"><title>scenes harness</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font:12px monospace;color:#333}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#t{position:absolute;left:6px;top:4px;z-index:2;background:rgba(255,255,255,.7);padding:1px 4px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Podkova:wght@500;700;800&display=swap">
</head><body>
<div id="t"></div><canvas id="c"></canvas>
<script src="kv-gl.js?v=h2"></script><script src="kv-models.js?v=h2"></script><script src="kv-scenes.js?v=h2"></script>
<script>
var q = new URLSearchParams(location.search), scene = q.get('s') || 'pour', p = parseFloat(q.get('p') || '0.9'), tm = parseFloat(q.get('t') || '3.1');
var T = document.getElementById('t'), canvas = document.getElementById('c');
if (q.get('w')) { canvas.style.width = q.get('w') + 'px'; canvas.style.height = q.get('h') + 'px'; canvas.style.left = '10px'; canvas.style.top = '10px'; canvas.style.outline = '1px solid #888'; }
var bg = (scene === 'hero' || scene === 'prev') ? '#f3eee5' : scene === 'pour' ? (p < 0.5 ? '#e2642e' : '#2a1b13') : (p < 0.2 ? '#efe8d9' : '#cddde2');
document.body.style.background = bg;
var r = KvGL.create(canvas, { maxDpr: 1.5, shadowSize: 2048 });
if (!r) { T.textContent = 'NO GL'; throw new Error('no gl'); }
r.setDecals(KvGL.drawDecals());
T.textContent = scene + ' p=' + p;
var t0 = performance.now(), anim = q.get('anim') === '1';
function draw() {
  var time = anim ? (performance.now() - t0) / 1000 : tm;
  if (scene === 'pour') KvScenes.pour(r, p, time, {});
  else if (scene === 'hero') KvScenes.hero(r, time, 0.1, {});
  else if (scene === 'prev') KvScenes.preview(r, time, q.get('sel') || 'brazil');
  else KvScenes.delivery(r, p, time, {});
  if (anim) requestAnimationFrame(draw);
}
document.fonts.ready.then(function () { r.setDecals(KvGL.drawDecals()); draw(); });
draw();
</script></body></html>
